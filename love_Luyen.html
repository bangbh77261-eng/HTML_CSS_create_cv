<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trái Tim Hạt 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, #1a0010 0%, #000000 70%);
  }
  .ui-overlay {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #ff6b9d;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 20px rgba(255,107,157,0.8);
  }
  .ui-overlay h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .ui-overlay p {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 2px;
  }
  .controls {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .btn {
    padding: 10px 22px;
    background: rgba(255, 107, 157, 0.15);
    border: 1px solid rgba(255, 107, 157, 0.4);
    color: #ff6b9d;
    border-radius: 30px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .btn:hover {
    background: rgba(255, 107, 157, 0.3);
    box-shadow: 0 0 25px rgba(255, 107, 157, 0.5);
    transform: translateY(-2px);
  }
  .btn.active {
    background: rgba(255, 107, 157, 0.5);
    box-shadow: 0 0 30px rgba(255, 107, 157, 0.7);
  }
  .info {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 107, 157, 0.5);
    font-size: 11px;
    letter-spacing: 2px;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="ui-overlay">
  <h1>♥ TRÁI TIM HẠT 3D ♥</h1>
  <p>KÉO CHUỘT ĐỂ XOAY • CUỘN ĐỂ PHÓNG TO</p>
</div>

<div class="info">NHẤN NÚT ĐỂ THAY ĐỔI HIỆU ỨNG</div>

<div class="controls">
  <button class="btn active" data-mode="heart">💖 Trái Tim</button>
  <button class="btn" data-mode="explode">✨ Bùng Nổ</button>
  <button class="btn" data-mode="pulse">💓 Đập</button>
  <button class="btn" data-mode="spiral">🌀 Xoắn Ốc</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 50;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Heart parametric function
  function heartPosition(u, v, scale) {
    const x = 16 * Math.pow(Math.sin(u), 3);
    const y = 13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    const z = v * (1 - Math.abs(Math.sin(u))) * 8;
    return new THREE.Vector3(x * scale, y * scale, z * scale);
  }

  // Generate particles
  const PARTICLE_COUNT = 8000;
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const sizes = new Float32Array(PARTICLE_COUNT);
  const originalPositions = new Float32Array(PARTICLE_COUNT * 3);
  const velocities = new Float32Array(PARTICLE_COUNT * 3);
  const phases = new Float32Array(PARTICLE_COUNT);

  const colorPalette = [
    new THREE.Color(0xff1744),
    new THREE.Color(0xff4081),
    new THREE.Color(0xff6b9d),
    new THREE.Color(0xff80ab),
    new THREE.Color(0xffc1e3),
    new THREE.Color(0xffffff)
  ];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const u = Math.random() * Math.PI * 2;
    const v = (Math.random() - 0.5) * 2;
    const scale = 0.8 + Math.random() * 0.4;
    const pos = heartPosition(u, v, 1.2);
    
    // Add slight randomness for "tiny particles" effect
    pos.x += (Math.random() - 0.5) * 0.8;
    pos.y += (Math.random() - 0.5) * 0.8;
    pos.z += (Math.random() - 0.5) * 1.5;

    positions[i*3] = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    originalPositions[i*3] = pos.x;
    originalPositions[i*3+1] = pos.y;
    originalPositions[i*3+2] = pos.z;

    velocities[i*3] = (Math.random() - 0.5) * 0.5;
    velocities[i*3+1] = (Math.random() - 0.5) * 0.5;
    velocities[i*3+2] = (Math.random() - 0.5) * 0.5;

    const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
    colors[i*3] = color.r;
    colors[i*3+1] = color.g;
    colors[i*3+2] = color.b;

    sizes[i] = 0.3 + Math.random() * 0.7;
    phases[i] = Math.random() * Math.PI * 2;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  // Custom shader material for glowing particles
  const vertexShader = `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (200.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentShader = `
    varying vec3 vColor;
    void main() {
      vec2 center = gl_PointCoord - vec2(0.5);
      float dist = length(center);
      if (dist > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.2, 0.5, dist);
      float glow = exp(-dist * 4.0) * 0.8;
      gl_FragColor = vec4(vColor * (1.0 + glow), alpha);
    }
  `;

  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // Background stars
  const starGeom = new THREE.BufferGeometry();
  const starCount = 500;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 300;
    starPos[i*3+1] = (Math.random() - 0.5) * 300;
    starPos[i*3+2] = (Math.random() - 0.5) * 300;
  }
  starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.3,
    transparent: true,
    opacity: 0.6
  });
  const stars = new THREE.Points(starGeom, starMat);
  scene.add(stars);

  // Mouse interaction
  let mouseX = 0, mouseY = 0;
  let targetRotX = 0, targetRotY = 0;
  let isDragging = false;
  let prevMouseX = 0, prevMouseY = 0;
  let rotationX = 0, rotationY = 0;

  renderer.domElement.addEventListener('mousedown', (e) => {
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    if (isDragging) {
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      rotationY += dx * 0.01;
      rotationX += dy * 0.01;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    }
  });

  // Touch support
  renderer.domElement.addEventListener('touchstart', (e) => {
    isDragging = true;
    prevMouseX = e.touches[0].clientX;
    prevMouseY = e.touches[0].clientY;
  });
  renderer.domElement.addEventListener('touchend', () => { isDragging = false; });
  renderer.domElement.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      const dx = e.touches[0].clientX - prevMouseX;
      const dy = e.touches[0].clientY - prevMouseY;
      rotationY += dx * 0.01;
      rotationX += dy * 0.01;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;
    }
  });

  // Zoom
  window.addEventListener('wheel', (e) => {
    camera.position.z += e.deltaY * 0.05;
    camera.position.z = Math.max(20, Math.min(100, camera.position.z));
  });

  // Mode system
  let currentMode = 'heart';
  let modeTransition = 0;
  let explodeTime = 0;

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      if (currentMode === 'explode') explodeTime = 0;
      modeTransition = 0;
    });
  });

  // Animation
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    const delta = clock.getDelta();
    modeTransition = Math.min(1, modeTransition + 0.02);

    const posAttr = geometry.attributes.position;
    const sizeAttr = geometry.attributes.size;
    const colorAttr = geometry.attributes.color;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const ox = originalPositions[i3];
      const oy = originalPositions[i3+1];
      const oz = originalPositions[i3+2];
      const phase = phases[i];

      let tx = ox, ty = oy, tz = oz;

      if (currentMode === 'heart') {
        // Gentle breathing + floating
        const breath = Math.sin(time * 1.5 + phase) * 0.3;
        tx = ox * (1 + breath * 0.05);
        ty = oy * (1 + breath * 0.05);
        tz = oz * (1 + breath * 0.05);
        // Subtle floating
        tx += Math.sin(time * 0.8 + phase * 2) * 0.15;
        ty += Math.cos(time * 0.6 + phase * 3) * 0.15;
        tz += Math.sin(time * 0.7 + phase) * 0.2;
      } else if (currentMode === 'explode') {
        explodeTime += 0.016;
        const explodeFactor = Math.min(1, explodeTime * 0.8);
        const returnFactor = explodeTime > 3 ? Math.min(1, (explodeTime - 3) * 0.5) : 0;
        const spread = explodeFactor * (1 - returnFactor);
        tx = ox + velocities[i3] * spread * 30;
        ty = oy + velocities[i3+1] * spread * 30;
        tz = oz + velocities[i3+2] * spread * 30;
        if (explodeTime > 5) explodeTime = 0;
      } else if (currentMode === 'pulse') {
        // Heartbeat effect
        const beat = Math.pow(Math.sin(time * 4), 20);
        const pulse = 1 + beat * 0.3;
        tx = ox * pulse;
        ty = oy * pulse;
        tz = oz * pulse;
        // Extra shake on beat
        tx += Math.sin(time * 20) * beat * 0.5;
        ty += Math.cos(time * 20) * beat * 0.5;
      } else if (currentMode === 'spiral') {
        const angle = time * 0.5 + phase;
        const radius = Math.sqrt(ox*ox + oz*oz);
        const spiralY = oy + Math.sin(time + phase) * 3;
        tx = Math.cos(angle) * radius * 0.8;
        ty = spiralY;
        tz = Math.sin(angle) * radius * 0.8;
      }

      // Smooth transition
      const lerp = 0.05;
      posAttr.array[i3] += (tx - posAttr.array[i3]) * lerp;
      posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * lerp;
      posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * lerp;

      // Pulsing size
      sizeAttr.array[i] = (0.3 + Math.random() * 0.1) * (1 + Math.sin(time * 3 + phase) * 0.3);
    }

    posAttr.needsUpdate = true;
    sizeAttr.needsUpdate = true;

    // Auto rotation + drag
    if (!isDragging) {
      rotationY += 0.003;
    }
    particles.rotation.x += (rotationX - particles.rotation.x) * 0.05;
    particles.rotation.y += (rotationY - particles.rotation.y) * 0.05;

    // Subtle mouse follow
    targetRotX = mouseY * 0.2;
    targetRotY = mouseX * 0.2;

    stars.rotation.y = time * 0.02;
    stars.rotation.x = time * 0.01;

    renderer.render(scene, camera);
  }

  animate();

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
